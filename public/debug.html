<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>辅智通 · 调试预览</title><style>body{margin:0;font:14px "Microsoft YaHei",sans-serif;background:#f3f5f8;color:#172033}header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap}button,a{font:inherit;color:#1260ef}button{padding:8px 14px;border:1px solid #ccd5e0;border-radius:6px;background:white;cursor:pointer}main{padding:20px;overflow:auto}iframe{display:block;background:white;border:1px solid #dce1e8;border-radius:12px;margin:auto;max-width:100%;height:1050px}</style><header><strong>调试预览</strong><button data-mode="phone">手机 / iPhone / Android</button><button data-mode="tablet">平板网页</button><button data-mode="desktop">电脑网页</button><a href="http://127.0.0.1:4176/" target="_blank">独立手机窗口</a><a href="/?preview=demo" target="_blank">独立电脑窗口</a></header><main><iframe title="调试界面" id="preview"></iframe></main><script>const frame=document.getElementById('preview');function show(mode){frame.src=mode==='phone'?'http://127.0.0.1:4176/':'/?preview=demo';frame.style.width=({phone:620,tablet:1024,desktop:1440})[mode]+'px';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.mode));show('phone');</script></html>
