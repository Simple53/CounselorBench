name: Desktop installers
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw new Error('Tag version mismatch')"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
      - run: xvfb-run --auto-servernum npm run test:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist/client
          retention-days: 14
  installers:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: windows-latest, platform: win, arch: arm64 }
          - { os: macos-latest, platform: mac, arch: x64 }
          - { os: macos-latest, platform: mac, arch: arm64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: dist/client
      - name: Build native packages
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: CounselorBench-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: CounselorBench-*
          path: installers
          merge-multiple: true
      - name: Generate checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" installers/* --repo "$REPOSITORY" --title "CounselorBench $RELEASE_TAG" --generate-notes --prerelease
